name: Build Jarvis

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Config.swift
      run: |
        cat > Jarvis/Config.swift << 'EOF'
        enum Config {
            static let geminiAPIKey       = ""
            static let openAIKey          = ""
            static let anthropicKey       = ""
            static let spotifyClientID    = ""
            static let spotifySecret      = ""
            static let googleClientID     = ""
            static let googleClientSecret = ""
        }
        EOF

    - name: Build
      run: |
        xcodebuild build \
          -project Jarvis.xcodeproj \
          -scheme Jarvis \
          -destination 'platform=macOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload .app
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis.app
        path: build/Build/Products/Debug/Jarvis.app
